<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- background dynamic change -->
     <section class="background">
        <div class="main-bg">

            <div class="main-container">
                <div class="tittle">
                    <h2>Web In Action</h2>
                    <p>Weather App</p>
                </div>
                  <div class="date-time">
                    <h3>Satureday 12:00am</h3>
                </div>
                <form action="">
                    <input type="search" name="" id="searchInput" placeholder="Search city weather" >
                    <button type="submit" id="searchButton">submit</button>
                </form>
                <div class="city">
                    <h3>Hyderabad</h3>
                </div>
                <div class="weather-img">
                   <img id="weather-icon" src="images/sun.png" alt="sun icon">
                   <h2>29 C</h2>
                   <p class="weather-msg">Sunny Day</p>
                </div>
               <div class="speed-msg">
                <img src="images/wind_icon.png" alt="weatehr speed">
                  <p class="speed">12km/h wind speed</p>
               </div>

            </div>

        </div>
     </section>
    






     <script src="script.js"></script>
</body>
</html>
